<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested List Example</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nested List Example</h1>
        <ol>
            <li>
                <h3>Fruits</h3>
                <ol>
                    <li>Apple</li>
                    <li>Mango</li>
                    <li>Banana</li>
                </ol>
            </li>
            <li>
                <h3>Vegetables</h3>
                <ul>
                    <li>Potato</li>
                    <li>Tomato</li>
                    <li>Carrot</li>
                </ul>
            </li>
        </ol>
    </div>
</body>
</html>
