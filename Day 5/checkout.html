<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Leafloom</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background-color: #fbfcfa; }
        
        .checkout-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 4%;
            min-height: 60vh;
        }

        .checkout-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .checkout-header h1 {
            font-size: 40px;
            color: #153a17;
            margin-bottom: 10px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 50px;
        }

        /* Cart Items */
        .cart-items {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.03);
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        
        .empty-cart svg { color: #d7e4d4; margin-bottom: 20px;}

        .cart-item {
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 25px;
            align-items: center;
            padding-bottom: 30px;
            margin-bottom: 30px;
            border-bottom: 1px solid #f0f0f0;
        }

        .cart-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .cart-img {
            width: 100px;
            height: 100px;
            border-radius: 16px;
            object-fit: cover;
        }

        .item-details h4 {
            font-size: 18px;
            color: #1f1f1f;
            margin-bottom: 8px;
        }

        .item-details p {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .qty-control {
            display: inline-flex;
            align-items: center;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 3px;
        }

        .qty-btn {
            background: none;
            border: none;
            width: 28px;
            height: 28px;
            cursor: pointer;
            border-radius: 6px;
            color: #555;
            transition: 0.2s;
        }

        .qty-btn:hover { background: #f5f5f5; }

        .qty-input {
            width: 35px;
            text-align: center;
            border: none;
            font-size: 14px;
            font-weight: 600;
        }

        .item-price {
            text-align: right;
        }

        .item-price strong {
            font-size: 20px;
            color: #2e7d32;
            display: block;
            margin-bottom: 15px;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #e53935;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .remove-btn:hover { text-decoration: underline; }

        /* Order Summary */
        .order-summary {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.03);
            position: sticky;
            top: 100px;
            align-self: start;
        }

        .summary-title {
            font-size: 22px;
            color: #153a17;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: #666;
            font-size: 15px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px dashed #d7e4d4;
            font-size: 22px;
            font-weight: 700;
            color: #1f1f1f;
        }

        .checkout-btn {
            width: 100%;
            padding: 18px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 35px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.2);
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .checkout-btn:hover {
            background: #1b5e20;
            transform: translateY(-2px);
        }
        
        .checkout-btn.disabled {
            background: #ccc;
            pointer-events: none;
            box-shadow: none;
        }

        @media (max-width: 900px) {
            .checkout-grid { grid-template-columns: 1fr; }
            .order-summary { position: static; }
        }
        @media (max-width: 600px) {
            .cart-item { grid-template-columns: 80px 1fr; }
            .item-price { text-align: left; grid-column: 2; margin-top: -15px;}
            .item-price strong { display: inline-block; margin-right: 20px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Leafloom</div>
        <nav>
            <a href="home.html">Home</a>
            <a href="collections.html">Collections</a>
        </nav>
        <a href="checkout.html" class="cart-btn">Cart (<span id="cart-count">0</span>)</a>
    </header>

    <div class="checkout-container">
        <div class="checkout-header">
            <h1>Shopping Cart</h1>
            <p style="color:#777;">Review your selected plants before payment.</p>
        </div>

        <div class="checkout-grid">
            <div class="cart-items" id="cart-items-container">
                <!-- Injected via JS -->
            </div>

            <div class="order-summary">
                <h3 class="summary-title">Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>
                <div class="summary-row">
                    <span>Tax (GST 18%)</span>
                    <span id="tax">₹0</span>
                </div>

                <div class="total-row">
                    <span>Total</span>
                    <span id="total" style="color: #2e7d32;">₹0</span>
                </div>

                <a href="payment.html" class="checkout-btn" id="proceed-btn">Proceed to Payment</a>
                
                <p style="text-align:center; margin-top:20px; font-size:13px; color:#999;">
                    🔒 Secure Encrypted Checkout
                </p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="cart.js"></script>
    <script>
        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const cart = CartSystem.getCart();

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24"><path fill="currentColor" d="M17 18a2 2 0 0 1 2 2a2 2 0 0 1-2 2a2 2 0 0 1-2-2c0-1.11.89-2 2-2M1 2h3.27l.94 2H20a1 1 0 0 1 1 1c0 .17-.05.34-.12.5l-3.58 6.47c-.4.73-1.16 1.16-1.99 1.16H8.1L7.18 15h12v2H7c-1.11 0-2-.89-2-2q0-.115.05-.23l.95-1.72L2.27 4H1zm16 16c-.55 0-1 .45-1 1s.45 1 1 1s1-.45 1-1s-.45-1-1-1m-9 0a2 2 0 0 1 2 2a2 2 0 0 1-2 2a2 2 0 0 1-2-2c0-1.11.89-2 2-2m0 1c-.55 0-1 .45-1 1s.45 1 1 1s1-.45 1-1s-.45-1-1-1"/></svg>
                        <h3>Your cart is empty</h3>
                        <p style="margin-top:10px;"><a href="collections.html" style="color:#2e7d32; font-weight:500;">Continue Shopping</a></p>
                    </div>`;
                document.getElementById('proceed-btn').classList.add('disabled');
                document.getElementById('subtotal').innerText = '₹0';
                document.getElementById('tax').innerText = '₹0';
                document.getElementById('total').innerText = '₹0';
                return;
            }

            document.getElementById('proceed-btn').classList.remove('disabled');

            container.innerHTML = '';
            let subtotal = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                subtotal += itemTotal;

                container.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.image}" class="cart-img">
                        <div class="item-details">
                            <h4>${item.name}</h4>
                            <p>${item.category} | ${item.size || 'Standard'}</p>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="updateItem('${item.id}', -1)">-</button>
                                <input type="text" class="qty-input" value="${item.qty}" readonly>
                                <button class="qty-btn" onclick="updateItem('${item.id}', 1)">+</button>
                            </div>
                        </div>
                        <div class="item-price">
                            <strong>₹${itemTotal}</strong>
                            <button class="remove-btn" onclick="removeItem('${item.id}')">Remove</button>
                        </div>
                    </div>
                `;
            });

            // Calc
            const tax = Math.round(subtotal * 0.18);
            const total = subtotal + tax;

            document.getElementById('subtotal').innerText = '₹' + subtotal;
            document.getElementById('tax').innerText = '₹' + tax;
            document.getElementById('total').innerText = '₹' + total;
            
            // Save total to localStorage for payment page
            localStorage.setItem('leafloom_total', total);
        }

        function updateItem(id, change) {
            const cart = CartSystem.getCart();
            const item = cart.find(i => i.id === id);
            if(item) {
                const newQty = item.qty + change;
                if(newQty > 0) {
                    CartSystem.updateQty(id, newQty);
                    renderCart();
                } else if (newQty === 0) {
                    removeItem(id);
                }
            }
        }

        function removeItem(id) {
            CartSystem.removeItem(id);
            renderCart();
        }

        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
