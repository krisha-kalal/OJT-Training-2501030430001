<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }
        .container {
            width: 70%;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background-color: #2e7d32;
            color: white;
            padding: 15px;
        }
        td {
            text-align: center;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Information Table</h1>
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Branch</th>
                <th>Semester</th>
            </tr>
            <tr>
                <td>101</td>

            </tr>
            <tr>
                <td>102</td>
                <td>Riya</td>
                <td>IT</td>
                <td>6</td>
            </tr>
            <tr>
                <td>103</td>
                <td>Aman</td>
                <td>AIML</td>
                <td>2</td>
            </tr>
            <tr>
                <td>104</td>
                <td>Neha</td>
                <td>CE</td>
                <td>8</td>
            </tr>
        </table>
    </div>
</body>
</html>
