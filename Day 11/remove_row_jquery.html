<!DOCTYPE html>
<html>
<head>
    <title>Remove Table Row</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body{
            font-family:Arial;
            padding:20px;
        }

        table{
            width:60%;
            border-collapse:collapse;
        }

        th,td{
            border:1px solid black;
            padding:10px;
            text-align:center;
        }

        button{
            padding:5px 10px;
            cursor:pointer;
        }
    </style>
</head>
<body>

    <h2>Remove Specific Table Row using jQuery</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Krisha</td>
            <td><button class="remove">Delete</button></td>
        </tr>

        <tr>
            <td>2</td>
            <td>Riya</td>
            <td><button class="remove">Delete</button></td>
        </tr>

        <tr>
            <td>3</td>
            <td>Vaidehi</td>
            <td><button class="remove">Delete</button></td>
        </tr>
    </table>

    <script>
        $(document).ready(function(){

            $(".remove").click(function(){

                $(this).closest("tr").remove();

            });

        });
    </script>

</body>
</html>
