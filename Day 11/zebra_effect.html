<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zebra Stripes Table</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body{
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        table{
            width: 60%;
            border-collapse: collapse;
            margin: auto;
        }

        th, td{
            border: 1px solid #000;
            padding: 12px;
            text-align: center;
        }

        th{
            background-color: rgb(254, 255, 195);
            color: black;
        }

        .zebra{
            background-color: #b6e1fa;
        }
    </style>
</head>
<body>

    <h2 style="text-align:center;">Zebra Stripes Table Effect</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Krisha</td>
            <td>CS</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Riya</td>
            <td>IT</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Priya</td>
            <td>AI</td>
        </tr>

        <tr>
            <td>4</td>
            <td>Vaidehi</td>
            <td>Cyber Security</td>
        </tr>
    </table>

    <script>
        $(document).ready(function () {

            $("table tr:odd").addClass("zebra");

        });
    </script>

</body>
</html>
